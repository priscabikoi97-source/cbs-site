/* VOICE: chaleureux, premium, une seule interlocutrice qui accueille
   IDEA: le hall d'accueil d'une agence : on choisit sa porte, puis on remplit le brief
   PICTURE: Prisca en blazer marine, posée sur le fond diagonal marine / rose et ses zigzags
   COLOUR and TYPE: marine #1b2550, rose poudré #f3cdd5, rose vif #e07a95 ; Newsreader titres, Sora textes
   LAYOUT: accueil + choix des services, profil, puis formulaire une colonne par service */
:root{color-scheme:light dark;
--navy:#1b2550;--rose:#f3cdd5;--pink:#e07a95;
--card:light-dark(#ffffff,#1d2547);--ink:light-dark(#1b2550,#f6eef1);
--mute:light-dark(#5b6283,#b9bdd6);--line:light-dark(#e6e2ea,#34406e);--chip:light-dark(#faf3f5,#252f58)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;color:var(--ink);font:16px/1.55 Sora,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
background:linear-gradient(172deg,var(--navy) 0 620px,var(--rose) 620px 100%)}
.zz{position:fixed;pointer-events:none;opacity:.35;z-index:0}
.zz.a{top:90px;right:-10px;width:220px}.zz.b{bottom:30px;left:-10px;width:260px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.logo{background:#fff;border-radius:16px;padding:8px 14px;display:inline-flex;box-shadow:0 8px 24px rgba(10,14,40,.25)}
.logo img{height:58px;width:auto;display:block}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:99px;padding:4px}
.lang button{background:transparent;color:#fff;font:600 14px Sora,sans-serif;border:0;border-radius:99px;min-height:40px;min-width:48px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--navy)}
.slogan{color:var(--rose);font:500 italic 18px/1.3 Newsreader,serif;margin:4px 0 0}
h1,h2,h3{font-family:Newsreader,serif;font-weight:600;margin:0;text-wrap:balance}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:28px;align-items:end;padding:26px 0 10px}
.hero h1{color:#fff;font-size:clamp(34px,6vw,52px);line-height:1.05;margin-bottom:12px}
.hero p{color:#e4e7f5;margin:0 0 18px;max-width:52ch;font-size:17px}
.portrait{position:relative;align-self:stretch;display:flex;align-items:flex-end;justify-content:center}
.portrait img{width:100%;max-width:330px;border-radius:200px 200px 24px 24px;background:var(--rose);display:block;box-shadow:0 24px 60px rgba(10,14,40,.35)}
.portrait .badge{position:absolute;left:0;bottom:22px;background:#fff;color:var(--navy);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.3;box-shadow:0 10px 30px rgba(10,14,40,.25)}
.portrait .badge b{display:block;font:600 17px Newsreader,serif}
.btn{font:600 16px Sora,sans-serif;min-height:48px;padding:12px 22px;border-radius:99px;border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri{background:var(--pink);color:#fff}.light{background:#fff;color:var(--navy)}
.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.wa{background:#1f9d55;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.panel{background:var(--card);border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 24px 60px rgba(10,14,40,.3);margin:22px 0}
.panel h2{font-size:clamp(28px,4.5vw,40px);line-height:1.08;margin-bottom:6px}
.lead{color:var(--mute);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.svc{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--chip);border:1.5px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .2s,border-color .2s}
.svc:hover{transform:translateY(-3px);border-color:var(--c)}
.svc .ic{width:48px;height:48px;border-radius:14px;background:var(--c);display:grid;place-items:center}
.svc .ic svg{width:26px;height:26px}
.svc h3{font-size:23px;line-height:1.15}
.svc p{margin:0;color:var(--mute);font-size:14px;flex:1}
.svc .go{font-weight:600;color:var(--c);font-size:15px}
.svc.full{background:linear-gradient(135deg,var(--navy),#3a3f78);color:#fff;border:0}
.svc.full p{color:#dfe2f2}.svc.full .go{color:var(--rose)}
.prof{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:28px;align-items:start}
.prof img{width:100%;border-radius:20px;background:var(--rose);display:block}
.prof p{margin:0 0 14px}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin:18px 0}
.pts div{background:var(--chip);border-radius:14px;padding:14px;font-size:14px}
.pts b{display:block;font:600 18px Newsreader,serif;margin-bottom:2px}
.brands{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.brands span{background:var(--chip);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px}
.brands small{color:var(--mute)}
h4{font:600 15px Sora,sans-serif;margin:18px 0 6px}
/* formulaire */
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fhead .ic{width:44px;height:44px;border-radius:12px;background:var(--navy);display:grid;place-items:center;flex:none}
.fhead .ic svg{width:24px;height:24px}
.fhead small{display:block;color:var(--mute);font-size:13px}
.fhead b{font:600 22px/1.1 Newsreader,serif}
.back{background:none;border:0;color:#fff;font:600 15px Sora,sans-serif;cursor:pointer;min-height:44px;padding:0;margin-top:14px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:13px;color:var(--mute)}
.bar{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.step h2{font-size:28px;line-height:1.1;margin-bottom:4px}
.f{margin-bottom:22px}
.f>label,.f>.q{display:block;font-weight:600;margin-bottom:4px}
.req{color:var(--pink)}
.help{font-size:13px;color:var(--mute);margin:0 0 8px}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;font:16px Sora,sans-serif;color:var(--ink);background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible,.chips label:focus-within{outline:3px solid var(--pink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:8px;min-height:44px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--chip);cursor:pointer;font-size:15px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips label:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
.chips input:checked+.dot{box-shadow:0 0 0 2px #fff}
.chips .dot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.tiers{display:grid;gap:10px}
.tiers label{display:block;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--chip);cursor:pointer}
.tiers input{position:absolute;opacity:0;width:1px;height:1px}
.tiers b{display:block;font:600 19px/1.2 Newsreader,serif;margin-bottom:2px}
.tiers span{font-size:14px;color:var(--mute)}
.tiers label:has(input:checked){border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.tiers label:focus-within{outline:3px solid var(--pink);outline-offset:2px}
.from{font-size:14px;font-weight:600}
.soc span,.soc a{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);text-decoration:none;background:var(--chip);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;min-height:44px}.soc a:hover{border-color:var(--pink)}.soc svg{width:22px;height:22px;flex:none}
.wk{margin:10px 0 2px;font-size:14px;font-weight:600;color:var(--mute)}
input[type=file]{font:15px Sora,sans-serif;max-width:100%}
.count{font-size:13px;color:var(--pink);font-weight:600;margin-left:6px}
.sc{display:grid;grid-template-columns:7.5em minmax(0,1fr) 7.5em;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}
.sc span:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--pink);height:44px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.err{color:#c0284d;font-size:14px;margin:0 0 12px;min-height:1em}
.apercu{background:var(--rose);color:#1b2550;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;margin:0 0 16px}
.recap{background:var(--chip);border-radius:14px;padding:16px;font-size:14px;max-height:340px;overflow:auto;white-space:pre-wrap;margin-bottom:16px}
.ok{color:#1f9d55;font-weight:600;font-size:15px;margin:12px 0 0}
.note{font-size:13px;color:var(--mute);margin-top:14px}
footer{text-align:center;font-size:14px;color:var(--navy);padding:10px 0 40px;font-weight:500}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .chips label:has(input:checked){background:var(--pink);border-color:var(--pink)}}
:root[data-theme=dark] .chips label:has(input:checked){background:var(--pink);border-color:var(--pink)}
@media(max-width:760px){.hero,.prof{grid-template-columns:1fr}.portrait img{max-width:260px}.prof img{max-width:320px}}
@media(max-width:600px){.logo img{height:48px}.sc{grid-template-columns:1fr 1fr}.sc input{grid-column:1/-1;grid-row:2}.zz{width:150px!important}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i,.svc{transition:none}}
/* ---- agence : navigation, ouverture, sections ---- */
.loader{position:fixed;inset:0;z-index:100;background:var(--navy);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
.loader.off{opacity:0;visibility:hidden}
.loader .lg{background:#fff;border-radius:18px;padding:12px 18px;animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
.loader .lg img{height:64px;display:block}
.loader svg{width:200px;margin-top:18px}
.loader path{stroke-dasharray:420;stroke-dashoffset:420;animation:drawz 1s .2s ease forwards}
@keyframes drawz{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.topnav{position:sticky;top:0;z-index:50;background:rgba(27,37,80,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.topnav .in{max-width:1140px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.topnav .logo{padding:5px 10px;border-radius:12px;box-shadow:none;cursor:pointer}
.topnav .logo img{height:38px}
.links{display:flex;gap:4px;margin-left:auto}
.links button{background:none;border:0;color:#e4e7f5;font:500 15px Sora,sans-serif;padding:10px 12px;border-radius:99px;cursor:pointer;min-height:44px}
.links button:hover{background:rgba(255,255,255,.1);color:#fff}
.topnav .cta{min-height:42px;padding:8px 18px;font-size:15px}
.burger{display:none;margin-left:auto;background:none;border:0;width:46px;height:46px;border-radius:12px;cursor:pointer}
.burger span{display:block;width:22px;height:2px;background:#fff;margin:5px auto;transition:transform .3s,opacity .3s}
.topnav.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.topnav.open .burger span:nth-child(2){opacity:0}
.topnav.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.kick{display:inline-flex;align-items:center;gap:8px;color:var(--rose);font:500 italic 18px Newsreader,serif;margin-bottom:10px}
.kick:before{display:none}
.hero{padding:44px 0 26px;align-items:center}
.hero h1{font-size:clamp(38px,6.4vw,62px)}
.portrait .float{position:absolute;width:31%;border-radius:12px;box-shadow:0 18px 40px rgba(10,14,40,.4);animation:floaty 6s ease-in-out infinite}
.portrait .f1{right:-4%;top:6%;transform:rotate(6deg)}
.portrait .f2{right:0;bottom:16%;animation-delay:-3s;transform:rotate(-5deg)}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -12px}}
.zzanim path{stroke-dasharray:14 0;animation:zz 3s linear infinite}
@keyframes zz{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.marq{overflow:hidden;margin:18px 0 4px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq .tr{display:flex;gap:12px;width:max-content;animation:mq 38s linear infinite}
.marq span{white-space:nowrap;background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:9px 18px;font-weight:500;font-size:15px}
@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--chip);border-radius:18px;padding:18px}
.stat b{display:block;font:600 clamp(30px,4.6vw,44px)/1 Newsreader,serif;color:var(--pink)}
.stat span{font-size:14px;color:var(--mute)}
.src{font-size:12px;color:var(--mute);margin:10px 0 0}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
.steps4 div{background:var(--chip);border-radius:18px;padding:18px;position:relative}
.steps4 i{font:600 italic 34px Newsreader,serif;color:var(--pink);font-style:italic;display:block;line-height:1}
.steps4 b{display:block;font:600 21px Newsreader,serif;margin:8px 0 4px}
.steps4 p{margin:0;font-size:14px;color:var(--mute)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.filters button{flex:none;min-height:42px;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:500 14px Sora,sans-serif;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.gal{columns:4 220px;column-gap:12px}
.gal button{display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in;background:var(--chip);position:relative;break-inside:avoid}
.gal img{width:100%;display:block;transition:transform .5s}
.gal button:hover img{transform:scale(1.04)}
.gal small{position:absolute;left:8px;bottom:8px;background:rgba(27,37,80,.85);color:#fff;border-radius:99px;padding:4px 10px;font-size:12px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(10,14,40,.92);display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:12px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:12px}
.lb p{color:#fff;margin:0;text-align:center}
.lb .x{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:22px;cursor:pointer}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.case{background:var(--chip);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.case .im{aspect-ratio:16/10;overflow:hidden;background:var(--navy)}
.case .im img{width:100%;height:100%;object-fit:cover;display:block}
.case .tx{padding:18px}
.case small{color:var(--pink);font-weight:600;font-size:13px}
.case h3{font-size:24px;margin:4px 0 6px}
.case p{margin:0 0 10px;font-size:14.5px;color:var(--mute)}
.case .kp{display:flex;flex-wrap:wrap;gap:16px;margin-top:4px}
.case .kp b{display:block;font:600 24px Newsreader,serif}
.case .kp span{font-size:12.5px;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools span{background:var(--chip);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;list-style:none;font-weight:600;padding:14px 34px 14px 0;position:relative;min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";position:absolute;right:4px;top:10px;font-size:24px;color:var(--pink);transition:transform .3s}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq details p{margin:0 0 14px;color:var(--mute)}
.ctaband{background:linear-gradient(135deg,var(--navy),#2c3570);color:#fff;border-radius:26px;padding:clamp(26px,5vw,48px);text-align:center;margin:22px 0;position:relative;overflow:hidden}
.ctaband h2{font-size:clamp(30px,5vw,46px);margin-bottom:10px}
.ctaband p{color:#dfe2f2;margin:0 auto 20px;max-width:52ch}
.ctaband .row{justify-content:center}
.foot{background:var(--navy);color:#dfe2f2;margin-top:30px;padding:36px 16px 90px;text-align:left}
.foot .in{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px}
.foot b{color:#fff;display:block;margin-bottom:8px}
.foot a,.foot button{color:#dfe2f2;text-decoration:none;background:none;border:0;padding:4px 0;font:15px Sora,sans-serif;cursor:pointer;display:block;text-align:left}
.foot .logo{display:inline-flex;margin-bottom:10px}
.foot .logo img{height:44px}
.foot .legal{max-width:1140px;margin:22px auto 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#b9bdd6}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;width:60px;height:60px;border-radius:50%;background:#1f9d55;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pulse 2.6s infinite}
.fab svg{width:32px;height:32px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.5)}70%{box-shadow:0 0 0 16px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.step{animation:slidein .45s ease both}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.mode{text-align:left;border:1.5px solid var(--line);background:var(--chip);border-radius:18px;padding:20px;cursor:pointer;color:var(--ink);font:inherit;transition:border-color .2s,transform .2s}
.mode:hover{border-color:var(--c);transform:translateY(-2px)}
.mode b{display:block;font:600 22px Newsreader,serif;margin-bottom:4px}
.mode .t{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.mode p{margin:0;font-size:14px;color:var(--mute)}

/* ===== V5 : premium minimaliste ===== */
:root,:root[data-theme=dark],:root[data-theme=light]{color-scheme:light;--card:#fff;--ink:#1b2550;--mute:#6b7190;--line:#ece6ea;--chip:#fbf6f8}
body{background:#fff!important;font-size:15.5px;line-height:1.65}
.zz{display:none}
h1,h2,h3{font-weight:500}
.wrap{max-width:none;padding:0}
.topnav{background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.topnav .in{max-width:1160px;padding:10px 20px}
.topnav .logo{box-shadow:none;padding:0;background:none}
.topnav .logo img{height:44px}
.topnav .lang{background:var(--chip)}
.topnav .lang button{color:var(--ink)}
.topnav .lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.sec5{padding:clamp(56px,9vw,110px) 20px}
.sec5 .in{max-width:1160px;margin:0 auto}
.sec5.alt{background:#fbf6f8}
.sec5.dark{background:var(--navy);color:#fff}
.sec5.dark .lead5,.sec5.dark .src{color:#c9cde4}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 italic 16px Newsreader,serif;color:var(--pink);margin-bottom:10px}
.eyebrow svg{width:34px}
.h2{font:500 clamp(28px,4.2vw,40px)/1.12 Newsreader,serif;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
.lead5{color:var(--mute);max-width:60ch;margin:0 0 34px;font-size:16px}
.center{text-align:center}.center .lead5{margin-left:auto;margin-right:auto}
/* carrousel */
.slider{position:relative;background:var(--navy);color:#fff;overflow:hidden;min-height:clamp(560px,86vh,720px)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:30px;max-width:1160px;margin:0 auto;padding:40px 20px 90px;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.slide.on{opacity:1;visibility:visible}
.slide .txt{transform:translateY(16px);transition:transform 1s ease}
.slide.on .txt{transform:none}
.slide h1,.slide h2{font:500 clamp(36px,5.6vw,58px)/1.06 Newsreader,serif;margin:0 0 16px;letter-spacing:-.015em;text-wrap:balance}
.slide p{color:#d7dbee;max-width:46ch;margin:0 0 26px;font-size:16.5px}
.slide .vis{position:relative;height:100%;max-height:520px;display:flex;align-items:center;justify-content:center}
.slide .vis img{max-height:480px;max-width:100%;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:scale(.96);transition:transform 6s ease}
.slide.on .vis img{transform:scale(1)}
.slide .vis.round img{border-radius:220px 220px 22px 22px;background:var(--rose)}
.slider:after{content:"";position:absolute;right:-10%;bottom:-30%;width:70%;height:80%;background:var(--rose);opacity:.12;transform:rotate(-12deg);pointer-events:none}
.sctl{position:absolute;left:0;right:0;bottom:24px;z-index:3}
.sctl .in{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:8px;flex:1}
.dots button{width:28px;height:4px;border-radius:4px;border:0;background:rgba(255,255,255,.3);cursor:pointer;padding:0;position:relative}
.dots button:after{content:"";position:absolute;inset:-12px 0}
.dots button[aria-current=true]{background:var(--pink);width:44px}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;font-size:18px}
.arr:hover{background:#fff;color:var(--navy)}
.btn{font-weight:500;letter-spacing:.01em}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--ink)}
/* clients */
.clients5{border-bottom:1px solid var(--line);padding:22px 0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.clients5 .tr{display:flex;gap:48px;width:max-content;animation:mq 40s linear infinite}
.clients5 span{white-space:nowrap;font:500 italic 19px Newsreader,serif;color:#9aa0b8}
/* qui sommes-nous */
.about5{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,80px);align-items:start}
.vals{display:grid;gap:22px}
.val{display:flex;gap:16px;align-items:flex-start}
.val .vi{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--pink)}
.val .vi svg{width:20px;height:20px}
.val b{display:block;font:500 19px Newsreader,serif;margin-bottom:2px}
.val p{margin:0;color:var(--mute);font-size:14.5px}
/* services */
.svc5{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.svc5 button{background:#fff;border:0;text-align:left;padding:28px 26px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:10px;transition:background .3s}
.svc5 button:hover{background:#fbf6f8}
.svc5 .si{width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center}
.svc5 .si svg{width:20px;height:20px}
.svc5 h3{font:500 21px/1.2 Newsreader,serif;margin:4px 0 0}
.svc5 p{margin:0;color:var(--mute);font-size:14.5px;flex:1}
.svc5 .go5{font-size:14px;color:var(--pink);font-weight:500}
/* méthode */
.meth5{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px;border-top:1px solid var(--line);padding-top:28px}
.meth5 i{font:500 italic 15px Newsreader,serif;color:var(--pink)}
.meth5 b{display:block;font:500 21px Newsreader,serif;margin:6px 0 6px}
.meth5 p{margin:0;color:var(--mute);font-size:14.5px}
/* chiffres */
.stats5{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.12);border-radius:18px;overflow:hidden}
.stats5 div{background:var(--navy);padding:26px 22px}
.stats5 b{display:block;font:500 clamp(34px,4.6vw,46px)/1 Newsreader,serif;color:#fff;margin-bottom:8px}
.stats5 span{font-size:13.5px;color:#c9cde4}
/* galerie & cas */
.filters button{border-color:var(--line);background:#fff}
.gal button{border-radius:12px}
.cases{gap:22px}
.case{background:#fff;border:1px solid var(--line);border-radius:18px}
.case h3{font-weight:500}
.case .kp b{font-weight:500;color:var(--pink)}
/* fondatrice */
.found{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:clamp(28px,6vw,70px);align-items:center}
.pcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(27,37,80,.06)}
.pcard img{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--rose);border:4px solid #fff;box-shadow:0 0 0 1px var(--line);display:block;margin:0 auto 14px}
.pcard b{display:block;font:500 22px Newsreader,serif}
.pcard small{display:block;color:var(--mute);font-size:13.5px;margin:2px 0 14px}
.pcard .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.pcard .tags span{font-size:12.5px;background:#fbf6f8;border-radius:99px;padding:5px 10px}
.pcard .soc5{display:flex;gap:10px;justify-content:center}
.pcard .soc5 a{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#fbf6f8}
.pcard .soc5 svg{width:22px;height:22px}
.found blockquote{margin:0;font:500 italic clamp(20px,2.6vw,26px)/1.4 Newsreader,serif;color:var(--ink);border-left:2px solid var(--pink);padding-left:20px;margin-bottom:22px}
/* faq & cta */
.faq5{max-width:820px;margin:0 auto}
.faq5 details{border-bottom:1px solid var(--line)}
.faq5 summary{font:500 18px Newsreader,serif}
.cta5{text-align:center}
.cta5 .h2{color:#fff}
.cta5 .row{justify-content:center}
.foot{margin-top:0}
.panel{box-shadow:0 10px 40px rgba(27,37,80,.06);border:1px solid var(--line)}
#view>.back,#view>.panel,#view>form{max-width:760px;margin-left:auto;margin-right:auto}
#view>.back{display:block;color:var(--ink);padding:20px 20px 0}
#view>.panel,#view>form{margin:16px auto 40px}
@media(max-width:860px){.slide{grid-template-columns:1fr;align-content:start;padding-top:34px;gap:18px}.slide .vis{max-height:260px;justify-content:flex-start}.slide .vis img{max-height:250px}
 .about5,.found{grid-template-columns:1fr}.meth5,.stats5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.slider{min-height:640px}.slide h1,.slide h2{font-size:34px}.slide p{font-size:15.5px}#view>.panel,#view>form{margin:12px 12px 32px}}
@media(prefers-reduced-motion:reduce){.slide,.slide .txt,.slide .vis img{transition:none}.clients5 .tr{animation:none}}

.slide{z-index:1}.slider:after{z-index:0}.sctl{z-index:3}
.topnav .logo{border:0}
@media(max-width:600px){.slider{min-height:720px}.slide{padding-bottom:100px}.slide .vis{max-height:230px}.slide .vis img{max-height:220px}.slide .row .btn{min-height:46px}}

const collect=()=>{const S=steps();if(cur>=S.length)return;for(const f of S[cur].f){
 if(f.type==='scale')f.o.forEach((p,i)=>D[f.id+i]=+$(f.id+i).value);
 else if(f.type==='files'){}
 else if(f.type==='radio'||f.type==='tier'){const c=document.querySelector(`input[name="${f.id}"]:checked`);D[f.id]=c?+c.value:undefined}
 else if(f.type==='check'||f.type==='swatch')D[f.id]=[...document.querySelectorAll(`input[name="${f.id}"]:checked`)].map(c=>+c.value);
 else D[f.id]=$(f.id).value.trim()}save()};
const val=f=>{const v=D[f.id];
 if(f.type==='radio')return v==null?'':FR(f.o[v]);
 if(f.type==='tier')return v==null?'':priceL(f.o[v],'fr')+' – '+f.o[v].d[0];
 if(f.type==='files')return (v||[]).length?(v.join(', ')+' (à joindre sur WhatsApp)'):'';
 if(f.type==='check')return (v||[]).map(i=>FR(f.o[i])).join(', ');
 if(f.type==='swatch')return (v||[]).map(i=>SWATCH[i][1]+' '+SWATCH[i][0]).join(', ');
 return v||''};

 for(const s of steps()){o+=`\n*${FR(s.t).toUpperCase()}*\n`;for(const f of s.f){
  if(f.type==='scale'){f.o.forEach((p,i)=>{const v=D[f.id+i]||3;o+=`• ${FR(p[0])} ↔ ${FR(p[1])} : ${v<3?FR(p[0]):v>3?FR(p[1]):'équilibre'} (${v}/5)\n`});continue}

 if(i.dataset&&i.dataset.files){D[i.id]=[...i.files].map(x=>x.name);save();$(i.id+'-list').textContent=D[i.id].join(' · ');return}
 if(!i.dataset||!i.dataset.max)return;
 const all=[...document.querySelectorAll(`input[name="${i.name}"]:checked`)];
 if(all.length>+i.dataset.max){i.checked=false;$('err').textContent=T('maxErr')}else $('err').textContent='';
 $('cnt').textContent=Math.min(all.length,+i.dataset.max)+'/'+i.dataset.max});
view.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='revform'){const n=(document.querySelector('input[name=rnote]:checked')||{}).value||'',c=$('rcom').value.trim(),nm=$('rnom').value.trim();
  if(!n&&!c){$('rerr').textContent=T('revNeed');return}$('rerr').textContent='';
  const msg=`*Avis sur le site CBS*\nNote : ${n?n+'/5':'—'}\nCommentaire : ${c||'—'}\nNom : ${nm||'—'}`;
  const done=()=>{$('rok').textContent=T('revThx');e.target.querySelector('button[type=submit]').disabled=true;const w=$('rwa');w.style.display='flex';w.innerHTML=`<a class="btn line" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${esc(T('revWa'))}</a>`};
  post('avis',{note:n,commentaire:c,nom:nm,langue:lang==='en'?'anglais':'français'}).then(done).catch(done);return}
 collect();
 const miss=steps()[cur].f.filter(f=>f.req&&(D[f.id]==null||D[f.id]===''));
 if(miss.length&&!APERCU){$('err').textContent=T('missing')+miss.map(f=>L(f.q)).join(', ');return}
 if(cur===0&&!started){started=true;post('debut',base()).catch(()=>{})}
 cur++;draw(1);
 if(cur>=steps().length&&!sent){sent=true;const st=$('status');
  post('brief',{...base(),entreprise:D.societe||'',formule:formule(),fichiers:(D.fichiers||[]).join(', '),reponses:recap()})
   .then(ok=>{if(st)st.textContent=ok?T('received'):''}).catch(()=>{})}
});
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(svc&&mode)collect();lang=b.dataset.l;try{localStorage.setItem('cbs-lang',lang)}catch(x){}draw(0)});
let tx0=null;view.addEventListener('touchstart',e=>{if(e.target.closest('.slider'))tx0=e.touches[0].clientX},{passive:true});
view.addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50){showSlide(sIdx+(dx<0?1:-1));startSlider()}});
$('foot').addEventListener('submit',e=>{if(e.target.id!=='nlform')return;e.preventDefault();const m=$('nlmail').value.trim();
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$('nlmsg').textContent=T('nlErr');return}
 const ok=()=>{$('nlmsg').textContent=T('nlOk');$('nlmail').value=''};post('newsletter',{email:m,langue:lang==='en'?'anglais':'français'}).then(ok).catch(ok)});
const pg5=$('prog5');addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;pg5.style.width=(h>0?scrollY/h*100:0)+'%'},{passive:true});
const XEND=new Date('2027-01-07T00:00:00+01:00');let xOff=false;try{xOff=sessionStorage.getItem('cbs-xmas')==='0'}catch(x){}
const xmasOn=()=>new Date()<XEND;
const drawX=()=>{const x=$('xmas');if(!xmasOn()||xOff){x.hidden=true;return}x.hidden=false;x.innerHTML=`${L(U.xm)} · <button type="button" class="go" data-go="services">${esc(T('xmGo'))} →</button><button type="button" class="xx" id="xx" aria-label="Fermer">×</button>`};
$('xmas').addEventListener('click',e=>{if(e.target.id==='xx'){xOff=true;try{sessionStorage.setItem('cbs-xmas','0')}catch(x){}drawX()}});
(()=>{const c=$('snow');if(!xmasOn()||matchMedia('(prefers-reduced-motion: reduce)').matches){c.remove();return}
 const x=c.getContext('2d');let W,H,fl=[];const N=innerWidth<600?20:38;
 const size=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0)};
 size();addEventListener('resize',size);
 for(let i=0;i<N;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,v:.35+Math.random()*.8,w:Math.random()*6.28,p:Math.random()<.3});
 let on=true;document.addEventListener('visibilitychange',()=>{on=!document.hidden;if(on)requestAnimationFrame(t)});
 const t=()=>{if(!on)return;x.clearRect(0,0,W,H);for(const f of fl){f.y+=f.v;f.w+=.012;f.x+=Math.sin(f.w)*.45;if(f.y>H+6){f.y=-6;f.x=Math.random()*W}
  x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fillStyle=f.p?'rgba(224,122,149,.55)':'rgba(255,255,255,.75)';x.shadowColor='rgba(27,37,80,.25)';x.shadowBlur=f.p?0:3;x.fill()}requestAnimationFrame(t)};
 requestAnimationFrame(t)})();
const hideLoader=()=>setTimeout(()=>$('loader').classList.add('off'),900);
let seen=false;try{seen=sessionStorage.getItem('cbs-seen')==='1';sessionStorage.setItem('cbs-seen','1')}catch(x){}
if(seen)$('loader').classList.add('off');else if(document.readyState==='complete')hideLoader();else window.addEventListener('load',hideLoader);
draw(0);
}
</script>
